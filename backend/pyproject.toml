[project]
name = "punjab-sports-mart-copilot"
version = "0.1.0"
description = "Policy-grounded retail operations copilot for the HCLTech hackathon"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "langchain-chroma>=1.0,<2",
    "langchain-text-splitters>=1.0,<2",
    "chromadb>=1.0,<2",
    "sqlglot>=27,<29",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10", "ruff>=0.8,<1", "httpx>=0.27,<1", "jsonschema>=4.23,<5",
    "openapi-spec-validator>=0.7.2,<0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
