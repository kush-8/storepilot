[project]
name = "punjab-sports-mart-copilot"
version = "0.1.0"
description = "Policy-grounded retail operations copilot for the HCLTech hackathon"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "scikit-learn>=1.5,<2",
    "openai>=1.54,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
